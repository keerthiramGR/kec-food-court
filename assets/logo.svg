<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="50%" stop-color="#FFA751"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF416C"/>
      <stop offset="100%" stop-color="#FF4B2B"/>
    </linearGradient>

    <linearGradient id="clocheGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FCEADE"/>
      <stop offset="70%" stop-color="#FDBB2D"/>
      <stop offset="100%" stop-color="#B21F1F"/>
    </linearGradient>

    <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2433"/>
      <stop offset="100%" stop-color="#0E121B"/>
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ambient Glow Ring -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Outer Shield Badge -->
  <circle cx="250" cy="250" r="210" fill="url(#darkBgGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#goldGlow)" />

  <!-- Inner Concentric Orbit Ring -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="14 10" />

  <!-- Top Decorative Stars -->
  <g fill="url(#goldGrad)">
    <polygon points="250,65 253,73 261,74 255,80 257,88 250,84 243,88 245,80 239,74 247,73" />
    <polygon points="215,75 217,81 223,82 219,87 220,93 215,90 210,93 211,87 207,82 213,81" opacity="0.8" />
    <polygon points="285,75 287,81 293,82 289,87 290,93 285,90 280,93 281,87 277,82 283,81" opacity="0.8" />
  </g>

  <!-- Steam Plumes Rising from Cloche -->
  <g class="steam-group" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 230,150 Q 220,130 232,112 Q 242,95 230,80" />
    <path d="M 250,145 Q 262,125 252,105 Q 242,88 252,72" stroke-width="5.5" />
    <path d="M 270,150 Q 280,130 268,112 Q 258,95 270,80" />
  </g>

  <!-- Gourmet Cloche Dome (Food Cover) -->
  <!-- Cloche Handle Knob -->
  <circle cx="250" cy="155" r="11" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  <circle cx="250" cy="155" r="6" fill="#FFF" opacity="0.8" />
  <path d="M 245,164 L 255,164 L 253,172 L 247,172 Z" fill="url(#goldGrad)" />

  <!-- Cloche Dome Arch -->
  <path d="M 170,230 C 170,175 205,170 250,170 C 295,170 330,175 330,230 Z" 
        fill="url(#clocheGrad)" 
        stroke="#FFE259" 
        stroke-width="3" 
        filter="url(#goldGlow)"/>

  <!-- Dome Highlights & Reflection -->
  <path d="M 185,224 C 185,185 212,178 248,176 C 220,180 195,195 188,224 Z" fill="#FFFFFF" opacity="0.45" />

  <!-- Cloche Base Platter Plate -->
  <path d="M 155,232 C 155,227 165,224 180,224 L 320,224 C 335,224 345,227 345,232 L 340,240 C 338,243 330,245 250,245 C 170,245 162,243 160,240 Z" 
        fill="url(#goldGrad)" 
        stroke="#FFE259" 
        stroke-width="2" />

  <!-- Crossed Chef Fork and Tasting Spoon Behind Cloche Base -->
  <g opacity="0.85" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round">
    <!-- Fork left to bottom right -->
    <line x1="180" y1="210" x2="320" y2="280" />
    <path d="M 172,204 L 182,213 M 176,198 L 186,207 M 181,194 L 191,203" stroke-width="3" />
    
    <!-- Spoon right to bottom left -->
    <line x1="320" y1="210" x2="180" y2="280" />
    <ellipse cx="325" cy="207" rx="10" ry="6" transform="rotate(-30 325 207)" fill="url(#goldGrad)" stroke="none" />
  </g>

  <!-- Ribbon Banner for KEC -->
  <path d="M 140,285 L 360,285 L 345,335 L 155,335 Z" fill="#151A26" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)"/>
  <polygon points="120,310 142,285 142,335" fill="#C2410C" />
  <polygon points="380,310 358,285 358,335" fill="#C2410C" />

  <!-- Text: KEC -->
  <text x="250" y="324" 
        font-family="'Inter', 'Poppins', 'Segoe UI', sans-serif" 
        font-weight="900" 
        font-size="40" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="9"
        filter="url(#intenseGlow)">KEC</text>

  <!-- Text: FOOD COURT -->
  <text x="250" y="375" 
        font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-weight="800" 
        font-size="28" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="5">FOOD COURT</text>

  <!-- Subtitle Tagline Badge: SMART CAMPUS DINING -->
  <rect x="160" y="398" width="180" height="24" rx="12" fill="url(#goldGrad)" opacity="0.9" />
  <text x="250" y="414" 
        font-family="'Inter', sans-serif" 
        font-weight="800" 
        font-size="11" 
        fill="#0E121B" 
        text-anchor="middle" 
        letter-spacing="2">SMART CAMPUS DINING</text>

  <!-- Bottom Crest Laurel / Leaves Accent -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.75">
    <path d="M 190,440 Q 250,460 310,440" />
    <circle cx="250" cy="452" r="4" fill="url(#goldGrad)" />
  </g>
</svg>
